<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a30"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#g)"/>
  <circle cx="200" cy="500" r="400" fill="rgba(75,108,247,0.07)"/>
  <circle cx="1000" cy="100" r="300" fill="rgba(62,207,142,0.05)"/>
  <!-- stage light beams -->
  <polygon points="100,0 200,0 700,600 500,600" fill="rgba(75,108,247,0.08)"/>
  <polygon points="400,0 500,0 950,600 750,600" fill="rgba(75,108,247,0.06)"/>
  <polygon points="700,0 800,0 1200,600 1050,600" fill="rgba(75,108,247,0.07)"/>
  <!-- crowd abstraction -->
  <rect x="0" y="500" width="1200" height="100" fill="rgba(0,0,0,0.4)"/>
  <ellipse cx="200" cy="500" rx="40" ry="50" fill="rgba(255,255,255,0.05)"/>
  <ellipse cx="350" cy="495" rx="35" ry="45" fill="rgba(255,255,255,0.04)"/>
  <ellipse cx="500" cy="502" rx="38" ry="48" fill="rgba(255,255,255,0.05)"/>
  <ellipse cx="650" cy="498" rx="40" ry="50" fill="rgba(255,255,255,0.04)"/>
  <ellipse cx="800" cy="503" rx="36" ry="46" fill="rgba(255,255,255,0.05)"/>
  <ellipse cx="950" cy="497" rx="40" ry="50" fill="rgba(255,255,255,0.04)"/>
  <ellipse cx="1100" cy="501" rx="35" ry="45" fill="rgba(255,255,255,0.05)"/>
  <!-- stars -->
  <circle cx="300" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="550" cy="50" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="800" cy="90" r="2" fill="white" opacity="0.5"/>
  <circle cx="1050" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="150" cy="160" r="1" fill="white" opacity="0.3"/>
  <circle cx="680" cy="40" r="1" fill="white" opacity="0.4"/>
</svg>