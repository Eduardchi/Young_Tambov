<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Тамбов Молодой</title>
    <script>
      // SPA redirect: GitHub Pages serves 404.html for unknown paths.
      // Encode the current URL as a query string and redirect to index.html.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
